name: Learning Loop & Thompson Sampling (Sundays 18:00 UTC)

on:
  schedule:
    # Runs Sundays at 18:00 UTC (12:00 AM Monday Dhaka)
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  learning-loop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Metrics & Reweight Bandit
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          python main.py metrics
          python main.py learn

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update bandit weights and golden examples [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"
