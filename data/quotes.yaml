# Quote library for the "guess_quote" format.
# Rules: public-domain authors only, every line checked against the original book (Project Gutenberg),
# no popular misattributions. Translations used are public-domain ones (named in `note`).
# ask: "writer" -> caption asks who wrote it; "book" -> asks which book it's from; omit = random.
# Add your own at the bottom; `id` must be unique.

